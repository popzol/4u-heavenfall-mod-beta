# Paths of this machine, for the interface tools and running from the code (docs/develop/development.md). Copy this file to
# local.ini and fill in what you have; local.ini is never committed. Relative paths are relative to this file;
# %APPDATA% and ~ are expanded. The program itself (python -m core.gui, HeavenfallBeta.exe) needs none of it.

[paths]
# Your decrypted Monster Hunter 4 Ultimate, European or American (.3ds, .cia, .zcci, .zcia): the recording probe is
# built from it (tools/ui/ui.py probe, tools/ui/ui_probe.py).
mh4u_rom = D:/games/Monster Hunter 4 Ultimate.3ds
# The game's RomFS dumped by the emulator (Azahar: right-click the game, Dump RomFS): the pictures of the screens are
# drawn from its layouts and textures (tools/ui/ui.py render, gallery, check). European game: 0004000000126100,
# American: 0004000000126300.
mh4u_romfs = %APPDATA%/Azahar/dump/romfs/0004000000126100
# Azahar's or Citra's user folder (default: $HEAVENFALL_EMULATOR_DIR if set, else %APPDATA%/Azahar): where probes are
# installed and Ctrl+P pictures are found.
# emulator_dir = %APPDATA%/Azahar
# Recordings, marks and builds (default: work/ in this folder).
# work_dir = work
